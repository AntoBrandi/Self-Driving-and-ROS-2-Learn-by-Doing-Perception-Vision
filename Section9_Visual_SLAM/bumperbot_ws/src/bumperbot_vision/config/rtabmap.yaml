stereo_odometry:
  ros__parameters:
    approx_sync: true
    qos: 2
    frame_id: base_footprint
    odom_frame_id: odom
    publish_tf: true
    wait_for_transform: 0.3
    wait_imu_to_init: true
    always_check_imu_tf: false
    keep_color: true
    publish_null_when_lost: false
    Reg/Force3DoF: 'true'
    guess_frame_id: wheel_odom
    Odom/ResetCountdown: '10'
    Odom/GuessMotion: 'true'